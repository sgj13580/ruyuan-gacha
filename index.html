  display: flex;
  flex-direction: column;
  gap: 6px;
}
.month-item {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  background: var(--bg);
  border-radius: 8px;
  border: 1px solid var(--border-light);
  gap: 10px;
}
.month-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--brown);

}
.month-count {

  font-weight: 700;
  color: var(--gold-dark);
  flex-shrink: 0;
}
.month-detail {
  flex: 1;
  font-size: 12px;
  color: var(--brown-light);
  text-align: right;
}

/* SECTION: hidden inputs */
#importInput, #charImportInput, #avatarInput, #charEditAvatarInput { display: none; }

/* SECTION: responsive */
@media (min-width: 600px) {
  .record-section, .char-section { max-width: 600px; margin: 0 auto; }
  .stats-panel { max-width: 600px; margin: 12px auto; }
  .pool-tabs-wrap { max-width: 600px; margin: 12px auto 0; }
  .bottom-bar { max-width: 600px; left: 50%; transform: translateX(-50%); border-radius: 16px 16px 0 0; }
  .fab { right: calc(50% - 280px); }
  .char-grid { grid-template-columns: repeat(5, 1fr); }
}
</style>
</head>
<body>

<!-- SECTION: header -->

<!-- SECTION: toast -->
<div class="toast" id="toast"></div>

<!-- SECTION: confirm dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-msg" id="confirmMsg"></div>
    <div class="confirm-btns">
      <button class="confirm-btn confirm-btn-cancel" id="confirmCancel">取消</button>
      <button class="confirm-btn confirm-btn-ok" id="confirmOk">确认</button>
    </div>
  </div>
</div>

<script>
/* SECTION: app state */
var STORAGE_KEY = 'ruyuan_gacha_v2';
var state = {
  currentTab: 'normal',
  currentPool: '__all__',
  normalRecords: [],
  pools: [],
  limitedRecords: [],
  characters: []
};

/* SECTION: storage */
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    showToast('存储空间不足，请导出数据后清理');
  }
}
function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      state.normalRecords = parsed.normalRecords || [];
      state.pools = parsed.pools || [];
      state.limitedRecords = parsed.limitedRecords || [];
      state.currentPool = parsed.currentPool || '__all__';
      state.characters = parsed.characters || [];
    }
    /* migrate v1 data */
    if (!raw) {
      var v1 = localStorage.getItem('ruyuan_gacha_v1');
      if (v1) {
        var p1 = JSON.parse(v1);
        state.normalRecords = p1.normalRecords || [];
        state.pools = p1.pools || [];
        state.limitedRecords = p1.limitedRecords || [];
        state.currentPool = p1.currentPool || '__all__';
        saveState();
      }
    }
  } catch (e) { /* ignore */ }
}

/* SECTION: utilities */
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}
function showConfirm(msg, onOk) {
  var overlay = document.getElementById('confirmOverlay');
  var msgEl = document.getElementById('confirmMsg');
  var okBtn = document.getElementById('confirmOk');
  var cancelBtn = document.getElementById('confirmCancel');
  msgEl.textContent = msg;
  overlay.classList.add('show');
  function cleanup() {
    overlay.classList.remove('show');
    okBtn.removeEventListener('click', onOkHandler);
    cancelBtn.removeEventListener('click', onCancelHandler);
    overlay.removeEventListener('click', onOverlayHandler);
  }
  function onOkHandler() { cleanup(); onOk(); }
  function onCancelHandler() { cleanup(); }
  function onOverlayHandler(e) { if (e.target === overlay) cleanup(); }
  okBtn.addEventListener('click', onOkHandler);
  cancelBtn.addEventListener('click', onCancelHandler);
  overlay.addEventListener('click', onOverlayHandler);
}
function findChar(charId) {
  return state.characters.find(function(c) { return c.id === charId; });
}
function makeAvatarEl(cls, name, avatarDataUrl) {
  var el = document.createElement('div');
  el.className = cls;
  if (avatarDataUrl) {
    var img = document.createElement('img');
    img.alt = name;
    img.src = avatarDataUrl;
    el.appendChild(img);
  } else {
    el.textContent = name.charAt(0);
  }
  return el;
}

/* SECTION: tab switching */
var mainTabs = document.querySelectorAll('.main-tab');
mainTabs.forEach(function(tab) {
  tab.addEventListener('click', function() {
    mainTabs.forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    state.currentTab = tab.dataset.tab;
    document.getElementById('normalView').style.display = state.currentTab === 'normal' ? '' : 'none';
    document.getElementById('limitedView').style.display = state.currentTab === 'limited' ? '' : 'none';
    document.getElementById('charsView').style.display = state.currentTab === 'chars' ? '' : 'none';
    var fab = document.getElementById('fabAdd');
    var bottomBar = document.getElementById('bottomBar');
    var charBottomBar = document.getElementById('charBottomBar');
    if (state.currentTab === 'chars') {
      fab.classList.remove('fab-hidden');
      bottomBar.style.display = 'none';
      charBottomBar.style.display = '';
    } else {
      fab.classList.remove('fab-hidden');
      bottomBar.style.display = '';
      charBottomBar.style.display = 'none';
    }
    render();
  });
});

/* SECTION: render normal pool */
function renderNormal() {
  var recs = state.normalRecords.slice().reverse();
  var list = document.getElementById('normalList');
  list.innerHTML = '';
  if (recs.length === 0) {
    list.appendChild(createEmpty('暂无记录，点击右下角 + 添加'));
  } else {
    recs.forEach(function(r) { list.appendChild(createRecordCard(r, 'normal')); });
  }
  updateNormalStats();
}
function updateNormalStats() {
  var recs = state.normalRecords;
  var total = recs.length;
  var ssr = recs.length;
  var avg = ssr > 0 ? (total / ssr).toFixed(1) : '-';
  document.getElementById('normalTotal').textContent = total;
  document.getElementById('normalSSR').textContent = ssr;
  document.getElementById('normalAvg').textContent = avg === '-' ? '-' : avg + '抽';
}

/* SECTION: shared record card builder */
function createRecordCard(r, type) {
  var isWai = type === 'limited' && r.upStatus === 'wai';
  var isUP = type === 'limited' && r.upStatus === 'yes';
  var card = document.createElement('div');
  card.className = 'record-card' + (isWai ? ' wai' : '');
  var ch = r.charId ? findChar(r.charId) : null;
  var avatarUrl = ch ? ch.avatar : null;
  var avatar = makeAvatarEl('record-avatar', r.name, avatarUrl);
  var info = document.createElement('div');
  info.className = 'record-info';
  var nameEl = document.createElement('div');
  nameEl.className = 'record-name';
  nameEl.textContent = r.name;
  var meta = document.createElement('div');
  meta.className = 'record-meta';
  var rarityBadge = document.createElement('span');
  rarityBadge.className = 'badge badge-ssr';
  rarityBadge.textContent = '绝密';
  meta.appendChild(rarityBadge);
  if (isUP) {
    var upBadge = document.createElement('span');
    upBadge.className = 'badge badge-up';
    upBadge.textContent = 'UP';
    meta.appendChild(upBadge);
  }
  if (isWai) {
    var waiBadge = document.createElement('span');
    waiBadge.className = 'badge badge-wai';
    waiBadge.textContent = '歪';
    meta.appendChild(waiBadge);
  }
  if (type === 'limited') {
    var pool = state.pools.find(function(p) { return p.id === r.poolId; });
    if (pool && state.currentPool === '__all__') {
      var poolTag = document.createElement('span');
      poolTag.className = 'record-pool-name';
      poolTag.textContent = pool.name;
      meta.appendChild(poolTag);
    }
  }
  info.appendChild(nameEl);
  info.appendChild(meta);
  var pull = document.createElement('div');
  pull.className = 'record-pull';
  pull.textContent = '第' + r.pull + '抽';
  var del = document.createElement('button');
  del.className = 'record-delete';
  del.textContent = '\u2715';
  var recordType = type;
  var recordId = r.id;
  del.addEventListener('click', function() {
    showConfirm('确认删除这条记录？', function() {
      if (recordType === 'normal') {
        state.normalRecords = state.normalRecords.filter(function(x) { return x.id !== recordId; });
        saveState();
        renderNormal();
      } else {
        state.limitedRecords = state.limitedRecords.filter(function(x) { return x.id !== recordId; });
        saveState();
        renderLimited();
      }
      showToast('已删除');
    });
  });
  card.appendChild(avatar);
  card.appendChild(info);
  card.appendChild(pull);
  card.appendChild(del);
  return card;
}
function createEmpty(text) {
  var empty = document.createElement('div');
  empty.className = 'empty-state';
  var icon = document.createElement('div');
  icon.className = 'empty-icon';
  icon.textContent = '\u{1F3EE}';
  var textEl = document.createElement('div');
  textEl.className = 'empty-text';
  textEl.textContent = text;
  empty.appendChild(icon);
  empty.appendChild(textEl);
  return empty;
}

/* SECTION: render limited pool */
function renderLimited() {
  renderPoolTabs();
  renderLimitedRecords();
  updateLimitedStats();
}
function renderPoolTabs() {
  var wrap = document.getElementById('poolTabs');
  wrap.innerHTML = '';
  var allBtn = document.createElement('button');
  allBtn.className = 'pool-tab' + (state.currentPool === '__all__' ? ' active' : '');
  allBtn.textContent = '全部';
  allBtn.addEventListener('click', function() {
    state.currentPool = '__all__';
    saveState();
    renderLimited();
  });
  wrap.appendChild(allBtn);
  state.pools.forEach(function(p) {
    var btn = document.createElement('button');
    btn.className = 'pool-tab' + (state.currentPool === p.id ? ' active' : '');
    btn.textContent = p.name;
    btn.addEventListener('click', function() {
      state.currentPool = p.id;
      saveState();
      renderLimited();
    });
    wrap.appendChild(btn);
  });
  var addBtn = document.createElement('button');
  addBtn.className = 'pool-tab-add';
  addBtn.textContent = '+';
  addBtn.addEventListener('click', function() {
    document.getElementById('poolModal').classList.add('show');
    document.getElementById('poolNameInput').value = '';
    setTimeout(function() { document.getElementById('poolNameInput').focus(); }, 300);
  });
  wrap.appendChild(addBtn);
  if (state.pools.length > 0) {
    var manageBtn = document.createElement('button');
    manageBtn.className = 'pool-tab';
    manageBtn.textContent = '管理';
    manageBtn.style.color = 'var(--red)';
    manageBtn.style.borderColor = 'var(--red-border)';
    manageBtn.addEventListener('click', function() {
      renderManagePools();
      document.getElementById('manageModal').classList.add('show');
    });
    wrap.appendChild(manageBtn);
  }
}
function renderLimitedRecords() {
  var recs = state.limitedRecords.slice();
  if (state.currentPool !== '__all__') {
    recs = recs.filter(function(r) { return r.poolId === state.currentPool; });
  }
  recs.reverse();
  var list = document.getElementById('limitedList');
  list.innerHTML = '';
  if (recs.length === 0) {
    list.appendChild(createEmpty(state.pools.length === 0 ? '请先创建卡池，再添加记录' : '暂无记录，点击右下角 + 添加'));
  } else {
    recs.forEach(function(r) { list.appendChild(createRecordCard(r, 'limited')); });
  }
}
function updateLimitedStats() {
  var allRecs = state.limitedRecords;
  var totalAll = allRecs.length;
  var ssrAll = allRecs.length;
  var upAll = allRecs.filter(function(r) { return r.upStatus === 'yes'; }).length;
  var avgAll = ssrAll > 0 ? (totalAll / ssrAll).toFixed(1) : '-';
  var noWaiAll = ssrAll > 0 ? (upAll / ssrAll * 100).toFixed(1) + '%' : '-';
  document.getElementById('limTotalAll').textContent = totalAll;
  document.getElementById('limSSRAll').textContent = ssrAll;
  document.getElementById('limAvgAll').textContent = avgAll === '-' ? '-' : avgAll + '抽';
  document.getElementById('limUPAll').textContent = upAll;
  document.getElementById('limNoWaiAll').textContent = noWaiAll;
  var poolPanel = document.getElementById('limitedStatsPool');
  if (state.currentPool !== '__all__') {
    var pool = state.pools.find(function(p) { return p.id === state.currentPool; });
    if (pool) {
      poolPanel.style.display = '';
      document.getElementById('poolStatsTitle').textContent = pool.name + ' \u00B7 统计';
      var pRecs = allRecs.filter(function(r) { return r.poolId === state.currentPool; });
      var pTotal = pRecs.length;
      var pSSR = pRecs.length;
      var pUP = pRecs.filter(function(r) { return r.upStatus === 'yes'; }).length;
      var pAvg = pSSR > 0 ? (pTotal / pSSR).toFixed(1) : '-';
      var pNoWai = pSSR > 0 ? (pUP / pSSR * 100).toFixed(1) + '%' : '-';
      document.getElementById('limTotalPool').textContent = pTotal;
      document.getElementById('limSSRPool').textContent = pSSR;
      document.getElementById('limAvgPool').textContent = pAvg === '-' ? '-' : pAvg + '抽';
      document.getElementById('limUPPool').textContent = pUP;
      document.getElementById('limNoWaiPool').textContent = pNoWai;
    } else {
      poolPanel.style.display = 'none';
    }
  } else {
    poolPanel.style.display = 'none';
  }
}

/* SECTION: render character pool */
var charEditMode = false;
function renderChars() {
  var grid = document.getElementById('charGrid');
  var searchVal = document.getElementById('charSearch').value.trim().toLowerCase();
  var chars = state.characters.slice();
  if (searchVal) {
    chars = chars.filter(function(c) { return c.name.toLowerCase().indexOf(searchVal) >= 0; });
  }
  grid.innerHTML = '';
  if (state.characters.length === 0) {
    grid.style.display = 'none';
    var emptyWrap = document.createElement('div');
    emptyWrap.style.gridColumn = '1 / -1';
    emptyWrap.appendChild(createEmpty('密探池为空，点击 + 添加 或导入密探'));
    grid.parentNode.insertBefore(emptyWrap, grid.nextSibling);
    /* remove old empties */
    var old = grid.parentNode.querySelectorAll('.empty-state');
    if (old.length > 1) { for (var i = 0; i < old.length - 1; i++) old[i].remove(); }
  } else {
    grid.style.display = '';
    /* remove stale empty */
    var sibling = grid.nextElementSibling;
    if (sibling && sibling.classList.contains('empty-state')) sibling.remove();
    chars.forEach(function(c) {
      var card = document.createElement('div');
      card.className = 'char-card' + (charEditMode ? ' char-edit-mode' : '');
      var avatar = makeAvatarEl('char-card-avatar', c.name, c.avatar);
      var nameEl = document.createElement('div');
      nameEl.className = 'char-card-name';
      nameEl.textContent = c.name;
      var delBtn = document.createElement('button');
      delBtn.className = 'char-card-del';
      delBtn.textContent = '\u2715';
      delBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        showConfirm('确认删除密探「' + c.name + '」？', function() {
          state.characters = state.characters.filter(function(x) { return x.id !== c.id; });
          saveState();
          renderChars();
          showToast('已删除');
        });
      });
      card.addEventListener('click', function() {
        if (charEditMode) {
          openCharEditModal(c);
        }
      });
      card.appendChild(delBtn);
      card.appendChild(avatar);
      card.appendChild(nameEl);
      grid.appendChild(card);
    });
  }
  document.getElementById('charCount').textContent = '共 ' + state.characters.length + ' 位密探' + (charEditMode ? '（编辑模式）' : '');
}
document.getElementById('charSearch').addEventListener('input', function() { renderChars(); });
document.getElementById('charManageBtn').addEventListener('click', function() {
  charEditMode = !charEditMode;
  this.textContent = charEditMode ? '完成' : '管理';
  this.style.background = charEditMode ? 'var(--gold)' : 'var(--bg-card-alt)';
  this.style.color = charEditMode ? '#fff' : 'var(--gold-dark)';
  this.style.borderColor = charEditMode ? 'var(--gold)' : 'var(--border)';
  renderChars();
});

/* SECTION: add record modal */
var selectedCharId = '';
var usingManualInput = false;
function openAddRecordModal(type) {
  var modal = document.getElementById('addModal');
  var poolForm = document.getElementById('addFormPool');
  var upForm = document.getElementById('addFormUP');
  selectedCharId = '';
  usingManualInput = false;
  if (type === 'limited') {
    if (state.pools.length === 0) { showToast('请先创建卡池'); return; }
    poolForm.style.display = '';
    upForm.style.display = '';
    var sel = document.getElementById('addPoolSelect');
    sel.innerHTML = '';
    state.pools.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      if (state.currentPool !== '__all__' && p.id === state.currentPool) opt.selected = true;
      sel.appendChild(opt);
    });
  } else {
    poolForm.style.display = 'none';
    upForm.style.display = 'none';
  }
  document.getElementById('addName').value = '';
  document.getElementById('addPull').value = '';
  resetRadio('addUP', 'no');
  showPickerMode();
  renderCharPicker();
  modal.classList.add('show');
}
function showPickerMode() {
  if (state.characters.length === 0) {
    document.getElementById('charPickerGroup').style.display = 'none';
    document.getElementById('manualInputGroup').style.display = '';
    usingManualInput = true;
  } else {
    document.getElementById('charPickerGroup').style.display = '';
    document.getElementById('manualInputGroup').style.display = 'none';
    usingManualInput = false;
  }
}
document.getElementById('toggleManualInput').addEventListener('click', function() {
  document.getElementById('charPickerGroup').style.display = 'none';
  document.getElementById('manualInputGroup').style.display = '';
  usingManualInput = true;
});
document.getElementById('togglePickerInput').addEventListener('click', function() {
  document.getElementById('charPickerGroup').style.display = '';
  document.getElementById('manualInputGroup').style.display = 'none';
  usingManualInput = false;
});
function renderCharPicker() {
  var grid = document.getElementById('charPickerGrid');
  var searchVal = document.getElementById('charPickerSearch').value.trim().toLowerCase();
  var chars = state.characters.slice();
  if (searchVal) {
    chars = chars.filter(function(c) { return c.name.toLowerCase().indexOf(searchVal) >= 0; });
  }
  grid.innerHTML = '';
  chars.forEach(function(c) {
    var item = document.createElement('div');
    item.className = 'char-pick-item' + (selectedCharId === c.id ? ' selected' : '');
    var avatar = makeAvatarEl('char-pick-avatar', c.name, c.avatar);
    var nameEl = document.createElement('div');
    nameEl.className = 'char-pick-name';
    nameEl.textContent = c.name;
    item.addEventListener('click', function() {
      selectedCharId = c.id;
      grid.querySelectorAll('.char-pick-item').forEach(function(el) { el.classList.remove('selected'); });
      item.classList.add('selected');
      document.getElementById('addName').value = c.name;
    });
    item.appendChild(avatar);
    item.appendChild(nameEl);
    grid.appendChild(item);
  });
}
document.getElementById('charPickerSearch').addEventListener('input', function() { renderCharPicker(); });
document.getElementById('addCancel').addEventListener('click', function() {
  document.getElementById('addModal').classList.remove('show');
});
document.getElementById('addConfirm').addEventListener('click', function() {
  var name = document.getElementById('addName').value.trim();
  var pull = parseInt(document.getElementById('addPull').value, 10);
  if (!name) { showToast(usingManualInput ? '请输入角色名' : '请选择角色'); return; }
  if (!pull || pull < 1) { showToast('请输入有效的抽数'); return; }
  var record = {
    id: genId(),
    name: name,
    rarity: 'ssr',
    pull: pull,
    time: Date.now(),
    charId: selectedCharId || ''
  };
  if (state.currentTab === 'limited') {
    record.poolId = document.getElementById('addPoolSelect').value;
    record.upStatus = getRadioValue('addUP');
    state.limitedRecords.push(record);
  } else {
    state.normalRecords.push(record);
  }
  saveState();
  document.getElementById('addModal').classList.remove('show');
  render();
  showToast('添加成功');
});

/* SECTION: radio helpers */
function getRadioValue(groupId) {
  var items = document.querySelectorAll('#' + groupId + ' .form-radio-item');
  for (var i = 0; i < items.length; i++) {
    if (items[i].classList.contains('selected')) return items[i].dataset.value;
  }
  return '';
}
function resetRadio(groupId, val) {
  var items = document.querySelectorAll('#' + groupId + ' .form-radio-item');
  items.forEach(function(item) {
    item.classList.toggle('selected', item.dataset.value === val);
  });
}
document.querySelectorAll('.form-radio-group').forEach(function(group) {
  group.addEventListener('click', function(e) {
    var item = e.target.closest('.form-radio-item');
    if (!item) return;
    group.querySelectorAll('.form-radio-item').forEach(function(i) { i.classList.remove('selected'); });
    item.classList.add('selected');
  });
});

function renderManagePools() {
  var list = document.getElementById('managePoolList');
  list.innerHTML = '';
  state.pools.forEach(function(p) {
    var item = document.createElement('div');
    item.className = 'pool-manage-item';
    var nameEl = document.createElement('div');
    nameEl.className = 'pool-manage-name';
    nameEl.textContent = p.name;
    var count = state.limitedRecords.filter(function(r) { return r.poolId === p.id; }).length;
    var countEl = document.createElement('span');
    countEl.style.fontSize = '12px';
    countEl.style.color = 'var(--brown-light)';
    countEl.textContent = count + '条记录';
    var delBtn = document.createElement('button');
    delBtn.className = 'pool-manage-del';
    delBtn.textContent = '\u2715';
    delBtn.addEventListener('click', function() {
      var msg = count > 0 ? '卡池「' + p.name + '」有' + count + '条记录，删除卡池将同时删除所有记录，确认？' : '确认删除卡池「' + p.name + '」？';
      showConfirm(msg, function() {
        state.pools = state.pools.filter(function(x) { return x.id !== p.id; });
        state.limitedRecords = state.limitedRecords.filter(function(r) { return r.poolId !== p.id; });
        if (state.currentPool === p.id) state.currentPool = '__all__';
        saveState();
        renderManagePools();
        renderLimited();
        showToast('卡池已删除');
      });
    });
    item.appendChild(nameEl);
    item.appendChild(countEl);
    item.appendChild(delBtn);
    list.appendChild(item);
  });
}

/* SECTION: export / import / clear (records) */
document.getElementById('btnExport').addEventListener('click', function() {
  var data = JSON.stringify(state, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '如鸢抽卡记录_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('数据已导出');
});
document.getElementById('btnImport').addEventListener('click', function() {
  document.getElementById('importInput').click();
});
document.getElementById('importInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      if (imported.normalRecords || imported.limitedRecords) {
        state.normalRecords = imported.normalRecords || [];
        state.pools = imported.pools || [];
        state.limitedRecords = imported.limitedRecords || [];
        state.currentPool = imported.currentPool || '__all__';
        state.characters = imported.characters || state.characters;
        saveState();
        render();
        showToast('数据导入成功');
      } else {
        showToast('文件格式不正确');
      }
    } catch (err) {
      showToast('文件解析失败');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
document.getElementById('btnClear').addEventListener('click', function() {
  if (state.currentTab === 'normal') {
    if (state.normalRecords.length === 0) { showToast('普池暂无记录'); return; }
    showConfirm('确认清空普池所有记录？此操作不可恢复。', function() {
      state.normalRecords = [];
      saveState();
      renderNormal();
      showToast('普池已清空');
    });
  } else {
    if (state.currentPool === '__all__') {
      if (state.limitedRecords.length === 0) { showToast('限定池暂无记录'); return; }
      showConfirm('确认清空所有限定池记录？卡池不会被删除。此操作不可恢复。', function() {
        state.limitedRecords = [];
        saveState();
        renderLimited();
        showToast('限定池记录已清空');
      });
    } else {
      var pool = state.pools.find(function(p) { return p.id === state.currentPool; });
      var poolRecs = state.limitedRecords.filter(function(r) { return r.poolId === state.currentPool; });
      if (poolRecs.length === 0) { showToast('该卡池暂无记录'); return; }
      var name = pool ? pool.name : '当前卡池';
      showConfirm('确认清空「' + name + '」的所有记录？此操作不可恢复。', function() {
        state.limitedRecords = state.limitedRecords.filter(function(r) { return r.poolId !== state.currentPool; });
        saveState();
        renderLimited();
        showToast('「' + name + '」已清空');
      });
    }
  }
});

document.getElementById('charBtnExport').addEventListener('click', function() {
  if (state.characters.length === 0) { showToast('密探池为空'); return; }
  var exportData = { characters: state.characters };

});
document.getElementById('charBtnImport').addEventListener('click', function() {
  document.getElementById('charImportInput').click();
});
document.getElementById('charImportInput').addEventListener('change', function(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var imported = JSON.parse(ev.target.result);
      var chars = imported.characters || imported;
      if (!Array.isArray(chars)) { showToast('文件格式不正确'); return; }
      var addCount = 0;
      chars.forEach(function(c) {
        if (c.name) {
          var exists = state.characters.find(function(x) { return x.name === c.name; });
          if (!exists) {
            state.characters.push({ id: c.id || genId(), name: c.name, avatar: c.avatar || '' });
            addCount++;
          }
        }
      });
      saveState();
      renderChars();
      showToast('导入成功，新增 ' + addCount + ' 位密探');
    } catch (err) {
      showToast('文件解析失败');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('pasteImportConfirm').addEventListener('click', function() {
  var text = document.getElementById('pasteImportText').value.trim();
  if (!text) { showToast('请粘贴 JSON 数据'); return; }
  try {
    var imported = JSON.parse(text);
    var chars = imported.characters || imported;
    if (!Array.isArray(chars)) { showToast('格式不正确，需要 JSON 数组'); return; }
    var addCount = 0;
    chars.forEach(function(c) {
      if (c.name) {
        var exists = state.characters.find(function(x) { return x.name === c.name; });
        if (!exists) {
          state.characters.push({ id: c.id || genId(), name: c.name, avatar: c.avatar || '' });
          addCount++;
        }
      }
    });
    saveState();
    renderChars();
    document.getElementById('pasteImportModal').classList.remove('show');
    showToast('导入成功，新增 ' + addCount + ' 位密探');
  } catch (err) {
    showToast('JSON 解析失败，请检查格式');
  }
});

});

/* SECTION: render all */
function render() {
  if (state.currentTab === 'normal') {
    renderNormal();
  } else if (state.currentTab === 'limited') {
    renderLimited();
  } else {
    renderChars();
  }
  renderTrend();
}

/* SECTION: trend chart */
function formatMonthKey(ts) {
  var d = new Date(ts);
  var y = d.getFullYear();
  var m = ('0' + (d.getMonth() + 1)).slice(-2);
  return y + '-' + m;
}
function renderTrend() {
  renderTrendForView('normal', state.normalRecords, false);
  renderTrendForView('limited', state.limitedRecords, true);
}
function renderTrendForView(prefix, records, isLimited) {
  var chartEl = document.getElementById(prefix + 'TrendChart');
  var monthEl = document.getElementById(prefix + 'TrendMonth');
  chartEl.innerHTML = '';
  monthEl.innerHTML = '';
  if (records.length === 0) {
    var emptyDiv = document.createElement('div');
    emptyDiv.className = 'trend-empty';
    emptyDiv.textContent = '暂无记录，添加记录后可查看趋势';
    chartEl.appendChild(emptyDiv);
    return;
  }
  var sorted = records.slice().sort(function(a, b) { return a.time - b.time; });
  var monthMap = {};
  var monthOrder = [];
  sorted.forEach(function(r) {
    var mk = formatMonthKey(r.time);
    if (!monthMap[mk]) { monthMap[mk] = { total: 0, up: 0, wai: 0 }; monthOrder.push(mk); }
    monthMap[mk].total++;
    if (isLimited && r.upStatus === 'yes') monthMap[mk].up++;
    if (isLimited && r.upStatus === 'wai') monthMap[mk].wai++;
  });
  var months = monthOrder;
  var maxVal = 0;
  months.forEach(function(mk) { if (monthMap[mk].total > maxVal) maxVal = monthMap[mk].total; });
  var barH = 28;
  var topPad = 24;
  var leftPad = 14;
  var rightPad = 44;
  var canvasH = topPad + months.length * barH + 10;
  var wrapWidth = chartEl.offsetWidth || 300;
  var canvasW = Math.max(wrapWidth, 200);
  var canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  canvas.style.width = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  chartEl.appendChild(canvas);
  var ctx = canvas.getContext('2d');
  var chartW = canvasW - leftPad - rightPad;
  var grad = ctx.createLinearGradient(leftPad, 0, leftPad + chartW, 0);
  grad.addColorStop(0, '#C8A04E');
  grad.addColorStop(1, '#F0DCA0');
  months.forEach(function(mk, i) {
    var val = monthMap[mk].total;
    var y = topPad + i * barH;
    var barWidth = maxVal > 0 ? (val / maxVal) * chartW : 0;
    ctx.fillStyle = '#F0E4D0';
    ctx.beginPath();
    ctx.roundRect(leftPad, y + 4, chartW, barH - 8, 4);
    ctx.fill();
    if (barWidth > 0) {
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(leftPad, y + 4, Math.max(barWidth, 6), barH - 8, 4);
      ctx.fill();
    }
    ctx.fillStyle = '#7A6552';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(mk, leftPad, y + barH / 2);
    ctx.fillStyle = '#9B7530';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String(val), leftPad + chartW + 8, y + barH / 2);
  });
  months.slice().reverse().forEach(function(mk) {
    var val = monthMap[mk].total;
    var item = document.createElement('div');
    item.className = 'month-item';
    var label = document.createElement('div');
    label.className = 'month-label';
    label.textContent = mk;
    var count = document.createElement('div');
    count.className = 'month-count';
    count.textContent = val + '抽';
    item.appendChild(label);
    item.appendChild(count);
    if (isLimited) {
      var detail = document.createElement('div');
      detail.className = 'month-detail';
      detail.textContent = 'UP: ' + monthMap[mk].up + '  歪: ' + monthMap[mk].wai;
      item.appendChild(detail);
    }
    monthEl.appendChild(item);
  });
  var chartTab = document.getElementById(prefix + 'TrendTabChart');
  var monthTab = document.getElementById(prefix + 'TrendTabMonth');
  chartTab.addEventListener('click', function() {
    chartTab.classList.add('active');
    monthTab.classList.remove('active');
    chartEl.style.display = '';
    monthEl.style.display = 'none';
  });
  monthTab.addEventListener('click', function() {
    monthTab.classList.add('active');
    chartTab.classList.remove('active');
    chartEl.style.display = 'none';
    monthEl.style.display = '';
  });
}
